{% if form.non_field_errors %}
    <tr>
        <td colspan="3" style="color: red;">{{ form.non_field_errors }}</td>
    </tr>
{% endif %}

{% for field in form %}

    <tr>
        <td width="20%"><b>{{ field.label_tag }}</b></td>
        <td width="60%">{{ field }}</td>
        <td style="color: red;">{{ field.errors }}</td>
    </tr>

{% endfor %}
