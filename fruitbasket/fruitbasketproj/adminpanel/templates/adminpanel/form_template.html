{% if form.non_field_errors %}
    <tr class="fb-form-errors">
        <td colspan="3">{{ form.non_field_errors }}</td>
    </tr>
{% endif %}

{% for field in form %}

    <tr class="fb-form-row">
        <td class="fb-form-label">
            <label for="{{ field.id_for_label }}">
                {% if field.name == 'Pid' %}Product ID
                {% elif field.name == 'Pname' %}Product name
                {% elif field.name == 'Pcategory' %}Category
                {% elif field.name == 'Psize' %}Pack size
                {% elif field.name == 'Pprice' %}Price
                {% elif field.name == 'Plowstock' %}Low stock threshold
                {% elif field.name == 'Pactive' %}Available in shop
                {% elif field.name == 'Pimage' %}Product image
                {% elif field.name == 'Pexpirydays' %}Shelf life (days)
                {% elif field.name == 'Cid' %}Customer ID
                {% elif field.name == 'Cname' %}Customer name
                {% elif field.name == 'Caddress' %}Delivery address
                {% elif field.name == 'Chouseholdsize' %}Household size
                {% elif field.name == 'Cmealsperweek' %}Meals per week
                {% elif field.name == 'Cuser' %}User account
                {% elif field.name == 'Oid' %}Order ID
                {% elif field.name == 'Ocustomer' %}Customer
                {% elif field.name == 'Oaddress' %}Delivery address
                {% elif field.name == 'Odate' %}Order date
                {% elif field.name == 'Ostatus' %}Order status
                {% else %}{{ field.label }}{% endif %}
            </label>
        </td>
        <td class="fb-form-control">{{ field }}</td>
        <td class="fb-form-error">{{ field.errors }}</td>
    </tr>

{% endfor %}
