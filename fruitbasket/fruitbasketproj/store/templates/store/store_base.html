{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Online store | Fruit Basket</title>
    <link rel="stylesheet" href="{% static 'store/vendor/bootstrap/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'store/css/site.css' %}">
</head>
<body class="fb-site">
    <a class="fb-skip" href="#main-content">Skip to content</a>
    <header class="fb-header">
        <div class="fb-container fb-masthead">
            {% include 'store/store_header.html' %}
        </div>
        <nav class="fb-container fb-navigation" aria-label="Customer area navigation">
            {% include 'store/store_navigation.html' %}
        </nav>
    </header>
    <main id="main-content" class="fb-container fb-content" tabindex="-1">
        {% include 'store/shared/messages.html' %}
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
