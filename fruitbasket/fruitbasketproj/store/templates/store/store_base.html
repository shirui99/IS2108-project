<html>
    <head>
        <title>Welcome to Fruit Basket</title>        
    </head>
    <body>

        <div style="width: 100%;">

            <div style="width: 100%; text-align: center; vertical-align: top;">
                {% include 'store/store_header.html' %}
            </div>            

            <div style="width: 20%; float: left; vertical-align: top;">
                {% include 'store/store_navigation.html' %}
            </div>

            <div style="width: 80%; float: left; vertical-align: top;">
                {% if messages %}
                    {% for message in messages %}
                        <h3 style="color: {% if message.tags == 'error' %}red{% else %}green{% endif %};">
                            {{ message }}
                        </h3>
                    {% endfor %}
                {% endif %}
                {% block content %}
                {% endblock %}
            </div>

        </div>
    </body>
</html>
