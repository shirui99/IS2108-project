{% if messages %}
<div class="fb-messages" aria-label="Notifications">
    {% for message in messages %}
    <div class="alert {% if message.level == 40 %}alert-danger{% elif message.level == 30 %}alert-warning{% elif message.level == 25 %}alert-success{% else %}alert-info{% endif %}" role="{% if message.level >= 30 %}alert{% else %}status{% endif %}">
        <strong>{% if message.level == 40 %}Error:{% elif message.level == 30 %}Warning:{% elif message.level == 25 %}Success:{% else %}Information:{% endif %}</strong>
        {{ message }}
    </div>
    {% endfor %}
</div>
{% endif %}
