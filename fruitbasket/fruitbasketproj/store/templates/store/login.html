<html>
    <head>
        <title>Log In - Fruit Basket</title>
    </head>
    <body>
        <h1>Log In</h1>

        {% if success_message %}
            <p style="color: green;"><b>{{ success_message }}</b></p>
        {% endif %}

        {% if error_message %}
            <p style="color: red;"><b>{{ error_message }}</b></p>
        {% endif %}
        
        <form method="post">
            
            {% csrf_token %}
            Username: <input type="text" name="username"><br>
            Password: <input type="password" name="password"><br>        

            <input type="reset" value="Reset">
            <input type="submit" value="Login">
        </form>

    </body>
</html>
